spring.application.name=pawfinder-api
server.port=${APP_PORT:3000}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/pawfinder?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

pawfinder.jwt.secret=${JWT_SECRET}
pawfinder.jwt.session-hours=${SESSION_EXPIRY_HOURS:24}
pawfinder.app-url=${APP_URL:http://localhost:5173}
pawfinder.reset-token-minutes=${RESET_TOKEN_MINUTES:60}
