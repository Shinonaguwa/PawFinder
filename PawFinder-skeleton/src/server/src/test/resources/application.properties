spring.datasource.url=jdbc:h2:mem:pawfinder;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

pawfinder.jwt.secret=test-secret-that-is-at-least-32-characters-long
pawfinder.jwt.session-hours=24
pawfinder.app-url=http://app.test
pawfinder.reset-token-minutes=60
